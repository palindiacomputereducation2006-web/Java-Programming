<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="460" fill="#1f4e79"/>
  <!-- UAC prompt (left) -->
  <rect x="30" y="50" width="350" height="340" fill="#ffffff" stroke="#888"/>
  <rect x="30" y="50" width="350" height="56" fill="#0b6a0b"/>
  <text x="46" y="84" font-size="15" fill="#ffffff">User Account Control</text>
  <text x="46" y="140" font-size="15" font-weight="bold" fill="#222">Do you want to allow this app to</text>
  <text x="46" y="160" font-size="15" font-weight="bold" fill="#222">make changes to your device?</text>
  <text x="46" y="200" font-size="13" fill="#333">Java(TM) SE Development Kit 27</text>
  <text x="46" y="222" font-size="12" fill="#555">Verified publisher: Oracle America, Inc.</text>
  <rect x="46" y="320" width="150" height="34" fill="#0078d7" stroke="#e5a50a" stroke-width="3"/><text x="104" y="342" font-size="14" font-weight="bold" fill="#fff">Yes</text>
  <rect x="214" y="320" width="150" height="34" fill="#e1e1e1" stroke="#adadad"/><text x="276" y="342" font-size="14" fill="#000">No</text>
  <!-- arrow -->
  <polygon points="392,215 412,205 412,225" fill="#ffffff" transform="rotate(180 402 215)"/>
  <text x="388" y="250" font-size="12" fill="#cfe2f3">then</text>
  <!-- progress (right) -->
  <rect x="420" y="50" width="350" height="340" fill="#ffffff" stroke="#888"/>
  <rect x="420" y="50" width="350" height="30" fill="#f0f0f0" stroke="#888"/>
  <text x="432" y="70" font-size="12" fill="#222">JDK 27 (64-bit) - Setup</text>
  <text x="440" y="120" font-size="15" font-weight="bold" fill="#222">Installing Java(TM) SE</text>
  <text x="440" y="140" font-size="15" font-weight="bold" fill="#222">Development Kit 27</text>
  <text x="440" y="180" font-size="12" fill="#555">Status: Copying new files</text>
  <rect x="440" y="195" width="310" height="18" fill="#e6e6e6" stroke="#bcbcbc"/>
  <rect x="441" y="196" width="200" height="16" fill="#06b025"/>
  <text x="440" y="250" font-size="12" fill="#555">Please wait. This takes about a minute.</text>
  <text x="20" y="450" font-size="10" fill="#cfe2f3">Illustration</text>
</svg>
