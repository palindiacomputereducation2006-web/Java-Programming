<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="460" fill="#1f4e79"/>
  <rect x="120" y="40" width="560" height="380" fill="#ffffff" stroke="#888"/>
  <rect x="120" y="40" width="560" height="30" fill="#f0f0f0" stroke="#888"/>
  <text x="132" y="60" font-size="13" fill="#222">Java(TM) SE Development Kit 27 (64-bit) - Setup</text>
  <text x="655" y="61" font-size="14" fill="#444">✕</text>
  <!-- header strip -->
  <rect x="121" y="71" width="558" height="60" fill="#fafafa"/>
  <text x="140" y="96" font-size="15" font-weight="bold" fill="#222">Destination Folder</text>
  <text x="140" y="117" font-size="12" fill="#555">Click Next to install to the default folder or click Change to choose another.</text>
  <line x1="121" y1="131" x2="679" y2="131" stroke="#dddddd"/>
  <!-- feature list -->
  <text x="140" y="165" font-size="13" fill="#333">Install Java(TM) SE Development Kit 27 (64-bit) to:</text>
  <rect x="140" y="178" width="400" height="28" fill="#ffffff" stroke="#e5a50a" stroke-width="2"/>
  <text x="150" y="197" font-size="13" font-family="Consolas, monospace" fill="#000">C:\Program Files\Java\jdk-27\</text>
  <rect x="552" y="179" width="90" height="26" fill="#e1e1e1" stroke="#adadad"/><text x="572" y="197" font-size="13" fill="#000">Change...</text>
  <text x="140" y="245" font-size="12" fill="#555">Tip: keep the default path. You will use it later for</text>
  <text x="140" y="263" font-size="12" fill="#555">JAVA_HOME and for the VS Code setting  jdk.jdkhome.</text>
  <!-- footer -->
  <line x1="121" y1="372" x2="679" y2="372" stroke="#dddddd"/>
  <rect x="420" y="384" width="80" height="26" fill="#e1e1e1" stroke="#adadad"/><text x="440" y="402" font-size="13" fill="#000">&lt; Back</text>
  <rect x="508" y="384" width="80" height="26" fill="#e5f1fb" stroke="#0078d7" stroke-width="2"/><text x="530" y="402" font-size="13" font-weight="bold" fill="#000">Next &gt;</text>
  <rect x="596" y="384" width="74" height="26" fill="#e1e1e1" stroke="#adadad"/><text x="612" y="402" font-size="13" fill="#000">Cancel</text>
  <ellipse cx="548" cy="397" rx="52" ry="22" fill="none" stroke="#e5a50a" stroke-width="3"/>
  <text x="20" y="450" font-size="10" fill="#cfe2f3">Illustration</text>
</svg>
