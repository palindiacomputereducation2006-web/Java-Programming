<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="460" fill="#1f4e79"/>
  <!-- installer window -->
  <rect x="120" y="40" width="560" height="380" fill="#ffffff" stroke="#888"/>
  <rect x="120" y="40" width="560" height="30" fill="#f0f0f0" stroke="#888"/>
  <text x="132" y="60" font-size="13" fill="#222">Java(TM) SE Development Kit 27 (64-bit) - Setup</text>
  <text x="655" y="61" font-size="14" fill="#444">✕</text>
  <!-- banner -->
  <rect x="121" y="71" width="170" height="300" fill="#c74634"/>
  <text x="145" y="200" font-size="34" font-weight="bold" fill="#ffffff">Java</text>
  <text x="145" y="230" font-size="14" fill="#ffe0da">ORACLE</text>
  <!-- body -->
  <text x="310" y="110" font-size="17" font-weight="bold" fill="#222">Welcome to the Setup Wizard</text>
  <text x="310" y="132" font-size="17" font-weight="bold" fill="#222">for Java(TM) SE Development Kit 27</text>
  <text x="310" y="175" font-size="13" fill="#333">The Setup Wizard will install Java(TM) SE</text>
  <text x="310" y="195" font-size="13" fill="#333">Development Kit 27 (64-bit) on your computer.</text>
  <text x="310" y="230" font-size="13" fill="#333">Click Next to continue or Cancel to exit</text>
  <text x="310" y="250" font-size="13" fill="#333">the Setup Wizard.</text>
  <!-- footer buttons -->
  <line x1="121" y1="372" x2="679" y2="372" stroke="#dddddd"/>
  <rect x="420" y="384" width="80" height="26" fill="#e1e1e1" stroke="#adadad"/><text x="440" y="402" font-size="13" fill="#888">&lt; Back</text>
  <rect x="508" y="384" width="80" height="26" fill="#e5f1fb" stroke="#0078d7" stroke-width="2"/><text x="530" y="402" font-size="13" font-weight="bold" fill="#000">Next &gt;</text>
  <rect x="596" y="384" width="74" height="26" fill="#e1e1e1" stroke="#adadad"/><text x="612" y="402" font-size="13" fill="#000">Cancel</text>
  <!-- callout -->
  <ellipse cx="548" cy="397" rx="52" ry="22" fill="none" stroke="#e5a50a" stroke-width="3"/>
  <text x="20" y="450" font-size="10" fill="#cfe2f3">Illustration</text>
</svg>
