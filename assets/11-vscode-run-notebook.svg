<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="480" fill="#1e1e1e"/>
  <rect x="0" y="0" width="800" height="30" fill="#323233"/>
  <text x="320" y="20" font-size="12" fill="#cccccc">variable.ijnb – java – Visual Studio Code</text>
  <!-- tab -->
  <rect x="0" y="30" width="800" height="34" fill="#252526"/>
  <rect x="0" y="30" width="150" height="34" fill="#1e1e1e"/>
  <text x="14" y="52" font-size="13" fill="#ffffff">variable.ijnb  ✕</text>
  <!-- notebook toolbar -->
  <text x="16" y="88" font-size="13" fill="#cccccc"><tspan fill="#ffffff">+ Code</tspan>   <tspan fill="#ffffff">+ Markdown</tspan>   <tspan fill="#89d185">▶▶ Run All</tspan>   ⟳ Restart   ☰ Outline</text>
  <rect x="148" y="72" width="82" height="24" fill="none" stroke="#e5a50a" stroke-width="2"/>
  <rect x="640" y="72" width="150" height="24" rx="4" fill="#2d2d30" stroke="#e5a50a" stroke-width="2"/>
  <text x="652" y="89" font-size="12" fill="#cccccc">☕ Java (Oracle)</text>
  <!-- markdown cell -->
  <text x="60" y="130" font-size="22" font-weight="bold" fill="#ffffff">Variables</text>
  <!-- code cell -->
  <rect x="50" y="150" width="730" height="120" fill="#252526" stroke="#0078d4"/>
  <rect x="44" y="150" width="4" height="200" fill="#0078d4"/>
  <circle cx="26" cy="172" r="13" fill="none" stroke="#89d185" stroke-width="2"/>
  <polygon points="22,165 22,179 33,172" fill="#89d185"/>
  <circle cx="26" cy="172" r="19" fill="none" stroke="#e5a50a" stroke-width="2"/>
  <text x="62" y="176" font-size="14" font-family="Consolas, monospace" fill="#569cd6">int <tspan fill="#9cdcfe">number</tspan> <tspan fill="#d4d4d4">=</tspan> <tspan fill="#b5cea8">12</tspan><tspan fill="#d4d4d4">;</tspan></text>
  <text x="62" y="198" font-size="14" font-family="Consolas, monospace" fill="#569cd6">int <tspan fill="#9cdcfe">number1</tspan> <tspan fill="#d4d4d4">=</tspan> <tspan fill="#b5cea8">5</tspan><tspan fill="#d4d4d4">;</tspan></text>
  <text x="62" y="220" font-size="14" font-family="Consolas, monospace" fill="#569cd6">int <tspan fill="#9cdcfe">sum</tspan> <tspan fill="#d4d4d4">= number1 + number;</tspan></text>
  <text x="62" y="242" font-size="14" font-family="Consolas, monospace" fill="#9cdcfe">System<tspan fill="#d4d4d4">.</tspan>out<tspan fill="#d4d4d4">.</tspan><tspan fill="#dcdcaa">print</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#ce9178">"the addition of "</tspan><tspan fill="#d4d4d4"> + number + ... + sum);</tspan></text>
  <text x="700" y="262" font-size="11" fill="#89d185">✔ 0.4s   Java</text>
  <!-- output -->
  <rect x="50" y="280" width="730" height="64" fill="#1e1e1e" stroke="#3c3c3c"/>
  <text x="62" y="300" font-size="11" fill="#888">Output</text>
  <text x="62" y="326" font-size="14" font-family="Consolas, monospace" fill="#d4d4d4">the addition of 12 and 5 is : 17</text>
  <!-- legend -->
  <text x="20" y="390" font-size="13" fill="#e5a50a">①</text><text x="40" y="390" font-size="13" fill="#cccccc">▶ next to a cell (or Ctrl+Enter / Shift+Enter) runs only that cell</text>
  <text x="20" y="414" font-size="13" fill="#e5a50a">②</text><text x="40" y="414" font-size="13" fill="#cccccc">Run All executes every cell from top to bottom</text>
  <text x="20" y="438" font-size="13" fill="#e5a50a">③</text><text x="40" y="438" font-size="13" fill="#cccccc">Kernel picker (top right) must show the Java kernel from the Oracle extension</text>
  <text x="10" y="472" font-size="10" fill="#777">Illustration</text>
</svg>
