<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="340" fill="#1e1e1e"/>
  <rect x="0" y="0" width="800" height="30" fill="#323233"/>
  <text x="330" y="20" font-size="12" fill="#cccccc">Settings – Visual Studio Code</text>
  <rect x="20" y="46" width="760" height="30" fill="#3c3c3c" stroke="#e5a50a" stroke-width="2"/>
  <text x="32" y="66" font-size="13" fill="#ffffff">jdk.jdkhome</text>
  <text x="20" y="104" font-size="12" fill="#cccccc"><tspan fill="#ffffff">User</tspan>    Workspace</text>
  <line x1="20" y1="112" x2="56" y2="112" stroke="#e7e7e7" stroke-width="2"/>
  <text x="40" y="150" font-size="14" font-weight="bold" fill="#ffffff">Jdk: Jdkhome</text>
  <text x="40" y="172" font-size="12" fill="#cccccc">Specifies default JDK for the Oracle Java Language Server and for running projects.</text>
  <rect x="40" y="184" width="500" height="28" fill="#3c3c3c" stroke="#e5a50a" stroke-width="2"/>
  <text x="50" y="203" font-size="13" font-family="Consolas, monospace" fill="#ffffff">C:\Program Files\Java\jdk-27</text>
  <text x="40" y="250" font-size="12" fill="#888888">Or put it in settings.json:</text>
  <rect x="40" y="260" width="500" height="50" fill="#252526"/>
  <text x="52" y="290" font-size="13" font-family="Consolas, monospace" fill="#9cdcfe">"jdk.jdkhome"<tspan fill="#d4d4d4">: </tspan><tspan fill="#ce9178">"C:\\Program Files\\Java\\jdk-27"</tspan></text>
  <text x="10" y="334" font-size="10" fill="#777">Illustration</text>
</svg>
