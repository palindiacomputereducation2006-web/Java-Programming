<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="500" fill="#dfe6ee"/>
  <rect x="100" y="20" width="600" height="460" fill="#ffffff" stroke="#888"/>
  <rect x="100" y="20" width="600" height="30" fill="#f0f0f0" stroke="#888"/>
  <text x="112" y="40" font-size="13" fill="#222">Environment Variables</text>
  <!-- user vars -->
  <text x="120" y="75" font-size="13" fill="#222">User variables for you</text>
  <rect x="120" y="85" width="560" height="80" fill="#fff" stroke="#adadad"/>
  <text x="130" y="103" font-size="12" font-weight="bold" fill="#222">Variable</text><text x="300" y="103" font-size="12" font-weight="bold" fill="#222">Value</text>
  <text x="130" y="123" font-size="12" fill="#333">OneDrive</text><text x="300" y="123" font-size="12" fill="#333">C:\Users\you\OneDrive</text>
  <text x="130" y="143" font-size="12" fill="#333">TEMP</text><text x="300" y="143" font-size="12" fill="#333">%USERPROFILE%\AppData\Local\Temp</text>
  <!-- system vars -->
  <text x="120" y="195" font-size="13" fill="#222">System variables</text>
  <rect x="120" y="205" width="560" height="150" fill="#fff" stroke="#adadad"/>
  <text x="130" y="223" font-size="12" font-weight="bold" fill="#222">Variable</text><text x="300" y="223" font-size="12" font-weight="bold" fill="#222">Value</text>
  <text x="130" y="245" font-size="12" fill="#333">ComSpec</text><text x="300" y="245" font-size="12" fill="#333">C:\Windows\system32\cmd.exe</text>
  <rect x="121" y="252" width="558" height="22" fill="#cce8ff" stroke="#e5a50a" stroke-width="2"/>
  <text x="130" y="268" font-size="12" font-weight="bold" fill="#000">JAVA_HOME</text><text x="300" y="268" font-size="12" font-weight="bold" fill="#000">C:\Program Files\Java\jdk-27</text>
  <text x="130" y="292" font-size="12" fill="#333">NUMBER_OF_PROCESSORS</text><text x="300" y="292" font-size="12" fill="#333">8</text>
  <rect x="121" y="299" width="558" height="22" fill="#fff4d6"/>
  <text x="130" y="315" font-size="12" font-weight="bold" fill="#000">Path</text><text x="300" y="315" font-size="12" fill="#000">%JAVA_HOME%\bin;C:\Windows\system32;...</text>
  <text x="130" y="340" font-size="12" fill="#333">OS</text><text x="300" y="340" font-size="12" fill="#333">Windows_NT</text>
  <rect x="440" y="365" width="70" height="24" fill="#e1e1e1" stroke="#0078d7" stroke-width="2"/><text x="456" y="382" font-size="12" fill="#000">New...</text>
  <rect x="520" y="365" width="70" height="24" fill="#e1e1e1" stroke="#adadad"/><text x="539" y="382" font-size="12" fill="#000">Edit...</text>
  <rect x="600" y="365" width="70" height="24" fill="#e1e1e1" stroke="#adadad"/><text x="614" y="382" font-size="12" fill="#000">Delete</text>
  <line x1="101" y1="410" x2="699" y2="410" stroke="#dddddd"/>
  <rect x="520" y="430" width="70" height="26" fill="#e5f1fb" stroke="#0078d7" stroke-width="2"/><text x="545" y="448" font-size="13" fill="#000">OK</text>
  <rect x="600" y="430" width="70" height="26" fill="#e1e1e1" stroke="#adadad"/><text x="613" y="448" font-size="13" fill="#000">Cancel</text>
  <text x="10" y="492" font-size="10" fill="#777">Illustration</text>
</svg>
